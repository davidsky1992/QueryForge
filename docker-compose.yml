# Local development stack for QueryForge.
#
#   Full stack:      docker compose up --build -d
#   Infrastructure:  docker compose up -d sqlserver redis   (API and frontend run on Windows)
#
# Secrets come from the git-ignored .env file (see .env.example). Every host port is bound to 127.0.0.1 only.

name: queryforge

x-sqlserver-connection: &sqlserver-connection "Server=sqlserver,1433;Database=QueryForge;User Id=sa;Password=${MSSQL_SA_PASSWORD:?Set MSSQL_SA_PASSWORD in .env (see .env.example)};TrustServerCertificate=True;Encrypt=False"

services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "${MSSQL_SA_PASSWORD:?Set MSSQL_SA_PASSWORD in .env (see .env.example)}"
      MSSQL_PID: "Developer"
    # Exposed on loopback for the Windows-run API, dotnet ef, and SQL tools. Containers use sqlserver:1433.
    # Connect from Windows with "127.0.0.1,1433": with a loopback-only binding, SqlClient connections that use the
    # host name "localhost" time out through Docker Desktop's port forwarding.
    ports:
      - "127.0.0.1:${SQLSERVER_HOST_PORT:-1433}:1433"
    volumes:
      - queryforge-sqlserver-data:/var/opt/mssql
    mem_limit: 2g
    healthcheck:
      # Logs in and runs a query, so "healthy" means SQL Server accepts connections, not just that the port is open.
      # $$ defers expansion to the container, keeping the password out of the rendered Compose configuration.
      test: ["CMD-SHELL", "SQLCMDPASSWORD=\"$$MSSQL_SA_PASSWORD\" /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -C -b -Q \"SELECT 1\" -o /dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "128mb", "--maxmemory-policy", "allkeys-lru"]
    # Exposed on loopback for the Windows-run API. Containers use redis:6379.
    ports:
      - "127.0.0.1:${REDIS_HOST_PORT:-6379}:6379"
    volumes:
      - queryforge-redis-data:/data
    mem_limit: 256m
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10

  # Applies pending EF Core migrations with a migration bundle, then exits. Safe to re-run: applied
  # migrations are skipped. The API starts only after this completes successfully.
  migrator:
    build:
      context: .
      dockerfile: src/QueryForge.Api/Dockerfile
      target: migrator
    image: queryforge-migrator:local
    environment:
      ConnectionStrings__SqlServer: *sqlserver-connection
    depends_on:
      sqlserver:
        condition: service_healthy
    restart: "no"
    mem_limit: 256m

  api:
    build:
      context: .
      dockerfile: src/QueryForge.Api/Dockerfile
      target: api
    image: queryforge-api:local
    environment:
      # Development enables Swagger and detailed errors for local use only; deployed environments use Production.
      ASPNETCORE_ENVIRONMENT: "${API_ENVIRONMENT:-Development}"
      ConnectionStrings__SqlServer: *sqlserver-connection
      ConnectionStrings__Redis: "redis:6379"
      # API keys are configured as SHA-256 hashes only (scripts/New-QueryForgeApiKey.ps1). Both are optional
      # locally: an unset hash leaves that slot unused, and with no keys every protected endpoint returns 401.
      Security__ApiKeys__0__Name: "local-admin"
      Security__ApiKeys__0__Hash: "${QUERYFORGE_ADMIN_KEY_SHA256:-}"
      Security__ApiKeys__0__Roles: "admin"
      Security__ApiKeys__1__Name: "local-reader"
      Security__ApiKeys__1__Hash: "${QUERYFORGE_READER_KEY_SHA256:-}"
      Security__ApiKeys__1__Roles: "reader"
      # Only the frontend's nginx (fixed address below) may set X-Forwarded-For/Proto. Requests reaching the API any
      # other way, including the host port, cannot spoof the client IP used for rate limiting.
      ForwardedHeaders__KnownProxies__0: "172.30.89.10"
    # Direct API access for Swagger and curl. The frontend reaches the API through its own nginx proxy instead.
    ports:
      - "127.0.0.1:${API_HOST_PORT:-5080}:8080"
    depends_on:
      sqlserver:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrator:
        condition: service_completed_successfully
    mem_limit: 512m
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--output", "/dev/null", "http://localhost:8080/health/live"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 20s

  web:
    build:
      context: src/QueryForge.Web
      args:
        # Empty: the browser calls same-origin /api/..., which nginx forwards to api:8080.
        VITE_API_BASE_URL: ""
    image: queryforge-web:local
    networks:
      default:
        # Fixed so the API can trust forwarded headers from this proxy only (ForwardedHeaders__KnownProxies__0).
        ipv4_address: 172.30.89.10
    ports:
      - "127.0.0.1:${WEB_HOST_PORT:-8080}:8080"
    depends_on:
      api:
        condition: service_healthy
    mem_limit: 64m
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--spider", "http://127.0.0.1:8080/"]
      interval: 10s
      timeout: 3s
      retries: 5

networks:
  default:
    ipam:
      config:
        # Explicit subnet so the nginx proxy address is stable. Change it (and the two addresses above) if it
        # overlaps a network on your machine.
        - subnet: 172.30.89.0/24

volumes:
  # Names unchanged from earlier versions so existing local data is kept.
  queryforge-sqlserver-data:
  queryforge-redis-data:
