name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

# Least privilege: the workflow only needs to read the repository. No secrets are used.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:
  dotnet:
    name: .NET build and tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out
        uses: actions/checkout@v4

      # global.json pins the 8.0.4xx feature band with rollForward=latestFeature; 8.0.x satisfies it.
      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', 'Directory.Build.props', 'global.json') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Restore
        run: dotnet restore QueryForge.sln

      # Directory.Build.props treats warnings as errors when CI=true (set by GitHub Actions).
      - name: Build
        run: dotnet build QueryForge.sln --configuration Release --no-restore

      # Integration tests start a SQL Server container through Testcontainers; ubuntu-latest provides Docker.
      - name: Test
        run: >
          dotnet test QueryForge.sln
          --configuration Release
          --no-build
          --logger trx
          --results-directory TestResults

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults/**/*.trx
          if-no-files-found: warn

  web:
    name: Frontend build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: src/QueryForge.Web

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: src/QueryForge.Web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type-check and build
        run: npm run build

  docker:
    name: Docker image builds
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out
        uses: actions/checkout@v4

      # Interpolation needs a value for the required password; this placeholder is not a secret and nothing is started.
      - name: Validate Compose file
        env:
          MSSQL_SA_PASSWORD: ci-placeholder-not-a-secret
        run: docker compose config --quiet

      # Images are built to catch Dockerfile errors; nothing is pushed.
      - name: Build API image
        run: docker build --file src/QueryForge.Api/Dockerfile --target api --tag queryforge-api:ci .

      - name: Build migrator image
        run: docker build --file src/QueryForge.Api/Dockerfile --target migrator --tag queryforge-migrator:ci .

      - name: Build web image
        run: docker build --tag queryforge-web:ci src/QueryForge.Web
